name: Production webroot contract

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-webroots:
    name: Production language webroots
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Verify standalone production language roots
        run: python tools/test_production_language_webroots.py
