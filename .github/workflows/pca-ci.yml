name: PCA CI

on:
  pull_request:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number
        required: false
        type: string
      path:
        description: Site path to capture
        required: false
        default: /en/
        type: string

permissions:
  contents: read

jobs:
  site-model:
    name: Site model
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Install image build dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick

      - name: Validate repository site model
        run: python tools/build.py check --root . --strict --no-autofix-prompt

      - name: Run additive translation regression
        run: python tools/test_additive_translation.py

  production-contract:
    name: Production contract
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Install image build dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick

      - name: Verify standalone production language roots
        run: python tools/test_production_language_webroots.py

      - name: Verify production deployment compatibility
        run: python tools/test_production_deployment_contract.py

      - name: Verify deployment hardening invariants
        run: python tools/test_deployment_hardening.py

      - name: Verify PR preview social metadata paths
        run: python tools/test_preview_social_metadata.py

  preview-build:
    name: Preview build
    runs-on: ubuntu-latest
    needs: site-model

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Install image build dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick

      - name: Build prefixed preview
        env:
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number || 'ci' }}
        run: |
          python tools/build.py preview \
            --root . \
            --to preview-output \
            --prefix "pr-${PR_NUMBER}"

      - name: Upload prefixed preview
        uses: actions/upload-artifact@v4
        with:
          name: pca-prefixed-preview
          path: preview-output
          if-no-files-found: error

  generated-integrity:
    name: Generated-site integrity
    runs-on: ubuntu-latest
    needs: preview-build

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download prefixed preview
        uses: actions/download-artifact@v4
        with:
          name: pca-prefixed-preview
          path: preview-root/pr-${{ github.event.pull_request.number || inputs.pr_number || 'ci' }}

      - name: Validate generated routes and references
        env:
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number || 'ci' }}
        run: |
          python tools/check_generated_site.py \
            --root "preview-root/pr-${PR_NUMBER}" \
            --prefix "pr-${PR_NUMBER}"

  accessibility:
    name: Accessibility
    runs-on: ubuntu-latest
    needs: preview-build

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Download prefixed preview
        uses: actions/download-artifact@v4
        with:
          name: pca-prefixed-preview
          path: preview-root/pr-${{ github.event.pull_request.number || inputs.pr_number || 'ci' }}

      - name: Install accessibility dependencies
        run: npm install --no-save playwright@1.62.1 @axe-core/playwright@4.13.0

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Scan generated pages
        env:
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number || 'ci' }}
        run: |
          set -euo pipefail
          python -m http.server 4173 --directory preview-root > /tmp/pca-a11y-server.log 2>&1 &
          curl --retry 20 --retry-connrefused --retry-delay 1 --fail "http://127.0.0.1:4173/pr-${PR_NUMBER}/en/" >/dev/null
          node tools/check_accessibility.mjs \
            --root "preview-root/pr-${PR_NUMBER}" \
            --base-url "http://127.0.0.1:4173/pr-${PR_NUMBER}"

  screenshots:
    name: Screenshots
    runs-on: ubuntu-latest
    needs: preview-build

    steps:
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Download prefixed preview
        uses: actions/download-artifact@v4
        with:
          name: pca-prefixed-preview
          path: preview-root/pr-${{ github.event.pull_request.number || inputs.pr_number || 'ci' }}

      - name: Install Playwright Chromium
        run: npx --yes playwright@1.62.1 install --with-deps chromium

      - name: Capture desktop and mobile screenshots
        env:
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number || 'ci' }}
          SCREENSHOT_PATH: ${{ inputs.path || '/en/' }}
        run: |
          set -euo pipefail
          mkdir -p screenshots
          python -m http.server 4173 --directory preview-root > /tmp/pca-site-server.log 2>&1 &
          TARGET="http://127.0.0.1:4173/pr-${PR_NUMBER}${SCREENSHOT_PATH}"
          curl --retry 20 --retry-connrefused --retry-delay 1 --fail "$TARGET" >/dev/null
          npx --yes playwright@1.62.1 screenshot --browser=chromium --viewport-size=1440,1000 --full-page "$TARGET" screenshots/desktop.png
          npx --yes playwright@1.62.1 screenshot --browser=chromium --viewport-size=390,844 --full-page "$TARGET" screenshots/mobile.png

      - name: Upload screenshots artifact
        uses: actions/upload-artifact@v4
        with:
          name: pca-preview-screenshots
          path: screenshots
          if-no-files-found: error
