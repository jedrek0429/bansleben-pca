name: Publish PCA screenshots

on:
  workflow_run:
    workflows: ["PCA CI"]
    types: [completed]

permissions:
  actions: read
  contents: write
  issues: write
  pull-requests: write

jobs:
  publish:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.pull_requests[0] != null
    runs-on: ubuntu-latest

    steps:
      - name: Check out trusted publisher code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download screenshot artifact
        uses: actions/download-artifact@v4
        with:
          name: pca-preview-screenshots
          path: screenshots
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish screenshots branch
        env:
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
        run: python tools/publish_screenshots_branch.py --pr-number "$PR_NUMBER"

      - name: Comment screenshots on pull request
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          SOURCE_RUN_URL: ${{ github.event.workflow_run.html_url }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
          SOURCE_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        with:
          script: |
            const marker = '<!-- pca-site-screenshots -->';
            const prNumber = Number(process.env.PR_NUMBER);
            const rawBase = `https://raw.githubusercontent.com/${context.repo.owner}/${context.repo.repo}/site-screenshots/pr-${prNumber}`;
            const cache = `${process.env.SOURCE_RUN_ID}-${process.env.SOURCE_RUN_ATTEMPT}`;
            const desktopUrl = `${rawBase}/desktop.png?cache=${cache}`;
            const mobileUrl = `${rawBase}/mobile.png?cache=${cache}`;
            const branchUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/tree/site-screenshots/pr-${prNumber}`;
            const body = `${marker}\nSite screenshots for /en/ are ready.\n\n<a href="${desktopUrl}"><img src="${desktopUrl}" alt="Desktop screenshot" width="320"></a>\n\n<a href="${mobileUrl}"><img src="${mobileUrl}" alt="Mobile screenshot" width="160"></a>\n\nLinks: [screenshot branch](${branchUrl}) - [CI run](${process.env.SOURCE_RUN_URL})`;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              per_page: 100,
            });
            const existing = comments.find((comment) => comment.user.type === 'Bot' && comment.body && comment.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body,
              });
            }
