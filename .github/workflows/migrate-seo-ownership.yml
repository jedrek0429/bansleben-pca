name: One-shot SEO ownership migration

on:
  push:
    branches:
      - refactor/remove-legacy-translation-shape

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/remove-legacy-translation-shape
      - name: Move language-specific SEO to locale and site owners
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          seo_path = Path('config/seo.json')
          seo = json.loads(seo_path.read_text(encoding='utf-8'))
          defaults = seo.pop('default_descriptions', {})
          descriptions = seo.pop('descriptions', {})
          seo.pop('site_urls', None)
          seo.pop('hreflang', None)
          seo.pop('og_locale', None)
          seo.pop('social_images', None)
          schema = seo.get('schema') or {}
          url_langs = schema.pop('url_langs', {})

          for locale_path in sorted(Path('locales').glob('*.json')):
              lang = locale_path.stem
              locale = json.loads(locale_path.read_text(encoding='utf-8'))
              owned = locale.get('seo') if isinstance(locale.get('seo'), dict) else {}
              if lang in defaults:
                  owned['default_description'] = defaults[lang]
              owned_pages = owned.get('descriptions') if isinstance(owned.get('descriptions'), dict) else {}
              for key, translated in descriptions.items():
                  if isinstance(translated, dict) and lang in translated:
                      owned_pages[key] = translated[lang]
              owned['descriptions'] = owned_pages
              locale['seo'] = owned
              locale_path.write_text(json.dumps(locale, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          for site_path in sorted(Path('sites').glob('*.json')):
              lang = site_path.stem
              site = json.loads(site_path.read_text(encoding='utf-8'))
              if lang in url_langs and url_langs[lang] != lang:
                  site['organization_url_language'] = url_langs[lang]
              site_path.write_text(json.dumps(site, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          seo_path.write_text(json.dumps(seo, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          path = Path('tools/build/seo.py')
          text = path.read_text(encoding='utf-8')
          replacements = {
          '''def site_base_url(ctx, seo_config: dict, lang: str, locales) -> str:\n    if not ctx.lang_in_url:\n        url = site_metadata(ctx, lang).get("url")\n        if not url:\n            url = value_from_locales(lang, "domain", locales)\n        if not url:\n            url = (seo_config.get("site_urls") or {}).get(lang)\n        return str(url or "").rstrip("/")\n    url = seo_config.get("preview_site_url")\n    return str(url or "").rstrip("/")\n''':
          '''def site_base_url(ctx, seo_config: dict, lang: str, locales) -> str:\n    if not ctx.lang_in_url:\n        return str(site_metadata(ctx, lang).get("url") or "").rstrip("/")\n    url = seo_config.get("preview_site_url")\n    return str(url or "").rstrip("/")\n''',
          '''def seo_description(seo_config: dict, locales, lang: str, key: str) -> str:\n    owned = locale_seo(locales, lang)\n    descriptions = owned.get("descriptions") or {}\n    value = descriptions.get(key) if isinstance(descriptions, dict) else None\n    if value:\n        return str(value)\n    default = owned.get("default_description")\n    if default:\n        return str(default)\n\n    legacy_descriptions = seo_config.get("descriptions") or {}\n    page_descriptions = legacy_descriptions.get(key) or {}\n    value = page_descriptions.get(lang)\n    if value:\n        return str(value)\n    defaults = seo_config.get("default_descriptions") or {}\n    return str(defaults.get(lang) or defaults.get("en") or "")\n''':
          '''def seo_description(seo_config: dict, locales, lang: str, key: str) -> str:\n    owned = locale_seo(locales, lang)\n    descriptions = owned.get("descriptions") or {}\n    value = descriptions.get(key) if isinstance(descriptions, dict) else None\n    if value:\n        return str(value)\n    return str(owned.get("default_description") or "")\n''',
          '''def page_og_locale(ctx, seo_config: dict, locales, lang: str) -> str:\n    value = site_metadata(ctx, lang).get("og_locale")\n    if not value:\n        value = locale_seo(locales, lang).get("og_locale")\n    if not value:\n        value = (seo_config.get("og_locale") or {}).get(lang)\n    return str(value or lang)\n''':
          '''def page_og_locale(ctx, seo_config: dict, locales, lang: str) -> str:\n    return str(site_metadata(ctx, lang).get("og_locale") or lang)\n''',
          '''def page_hreflang(ctx, seo_config: dict, locales, lang: str) -> str:\n    value = site_metadata(ctx, lang).get("hreflang")\n    if not value:\n        value = locale_seo(locales, lang).get("hreflang")\n    if not value:\n        value = (seo_config.get("hreflang") or {}).get(lang)\n    return str(value or lang)\n''':
          '''def page_hreflang(ctx, seo_config: dict, locales, lang: str) -> str:\n    return str(site_metadata(ctx, lang).get("hreflang") or lang)\n''',
          '''def site_social_image(ctx, seo_config: dict, locales, lang: str) -> str:\n    value = site_metadata(ctx, lang).get("social_image")\n    if not value:\n        value = locale_seo(locales, lang).get("social_image")\n    if not value:\n        value = (seo_config.get("social_images") or {}).get(lang)\n    return str(value or "")\n''':
          '''def site_social_image(ctx, seo_config: dict, locales, lang: str) -> str:\n    return str(site_metadata(ctx, lang).get("social_image") or "")\n''',
          '''def organization_url(schema_cfg: dict, site: str, lang: str) -> str:\n    url = schema_cfg.get("url")\n    if not url:\n        return site\n    lang_suffixes = schema_cfg.get("url_langs") or {}\n    return url + str(lang_suffixes.get(lang, lang))\n''':
          '''def organization_url(ctx, schema_cfg: dict, site: str, lang: str) -> str:\n    url = schema_cfg.get("url")\n    if not url:\n        return site\n    suffix = site_metadata(ctx, lang).get("organization_url_language") or lang\n    return url + str(suffix)\n''',
          'url = organization_url(schema_cfg, site_base_url(ctx, seo_config, lang, locales), lang)':
          'url = organization_url(ctx, schema_cfg, site_base_url(ctx, seo_config, lang, locales), lang)',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit('Expected SEO compatibility block not found; refusing partial migration')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit migrated SEO ownership
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add config/seo.json locales sites tools/build/seo.py
          git diff --cached --quiet && exit 0
          git commit -m 'Remove legacy SEO compatibility paths'
          git push origin HEAD:refactor/remove-legacy-translation-shape
